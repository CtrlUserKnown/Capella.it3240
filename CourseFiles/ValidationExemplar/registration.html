<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" type="text/css" href="css/registration.css">
</head>
<body>
    <p class="title">Registration Form</p>
    <!-- Form action # causes browser to stay on same page -->
    <form action="#">
        <div class="note">* = Required</div>
        <fieldset>
            <legend>Account Info</legend>
            <label for="userName">*User Name:</label>
            <input type="text" id="userName" name="userName" placeholder="Enter your user name (5+ chars)" required pattern="\w{5,}">
        </fieldset>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" placeholder="(###) ###-#####" pattern="\(\d{3}\) \d{3}-\d{4}">
            <label for="email">*Email:</label>
            <input type="email" id="email" name="email" placeholder="Email Address" required pattern="^[\w\.]+@\w+\.[a-zA-Z]{2,}$">
        </fieldset>
        <fieldset>
            <legend>Agree to Terms</legend>
            <label for="acceptTerms">*I agree to the Terms and Conditions</label>
            <input type="checkbox" id="acceptTerms" name="acceptTerms" required>
            <span class="error-message" id="acceptTermsError"></span>
        </fieldset>
        <input id="Submit" type="submit" value="Next Step" />
        <!-- span tag to display result message -->
        <span id="resultMessage"></span>
    </form>

    <!-- JavaScript link at end of body -->
    <script src="js/registration.js"></script>
</body>    
</html>
