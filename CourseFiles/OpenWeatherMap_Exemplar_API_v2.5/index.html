<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather by Coordinates</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <h1>Sunrise &amp; Sunset Lookup by Latitude & Longitude</h1>
    <p>Enter a latitude and longitude to see the local times for sunrise and sunset.</p>
</header>

<main>
    <section class="form-section">
        <form id="weather-form">
            <div class="form-row">
                <label for="lat">Latitude:</label>
                <input type="number" id="lat" name="lat" required min="-90" max="90" step="any">
            </div>

            <div class="form-row">
                <label for="lon">Longitude:</label>
                <input type="number" id="lon" name="lon" required min="-180" max="180" step="any">
            </div>

            <button type="submit">Get Sunrise/Sunset Times</button>
        </form>
    </section>

    <section id="message" class="message">
        <!-- Status messages will appear here -->
    </section>

    <section id="weather-result" class="weather-card hidden">
        <h2 id="location-name"></h2>
        <p id="sunrise"></p>
        <p id="sunset"></p>
    </section>
</main>

<footer>
    <p>Data from OpenWeatherMap (free API).</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
